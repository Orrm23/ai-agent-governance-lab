name: Security Check

on:
  push:
  pull_request:

jobs:
  secret-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall src

      - name: Verify secret files are absent
        shell: bash
        run: |
          test ! -f .env
          test ! -f agent-audit.jsonl
